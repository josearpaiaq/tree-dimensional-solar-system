<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene-canvas"></canvas>

      <div id="loading-screen">
        <div id="loading-label">Loading solar system…</div>
        <div id="loading-bar-track"><div id="loading-bar-fill"></div></div>
      </div>

      <nav id="nav-list" aria-label="Jump to planet"></nav>

      <div id="controls-hint">drag to orbit &middot; scroll to zoom &middot; click a planet</div>

      <aside id="facts-panel">
        <button id="facts-panel-close" aria-label="Back to overview">&larr; Overview</button>
        <h2 id="facts-panel-name"></h2>
        <dl id="facts-panel-stats"></dl>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
